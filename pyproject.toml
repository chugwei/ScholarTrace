[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scholartrace"
version = "0.11.0"
description = "研迹 ScholarTrace：可信、可追溯、可复现的科研工作台"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "ScholarTrace contributors" },
]
dependencies = [
  "alembic>=1.19,<2",
  "fastapi>=0.115,<0.116",
  "langchain-core>=1.2,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "pypdf>=5,<7",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.27,<1",
  "uvicorn>=0.30,<1",
  "pywebview>=5,<7",
]

[project.scripts]
scholartrace = "scholartrace.cli:app"

[dependency-groups]
dev = [
  "pyinstaller>=6,<7",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scholartrace"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/AGENTS.md",
  "/ScholarTrace_研迹_完整项目设计与实施计划.md",
  "/ScholarTrace_Goal_全项目实施Prompt.md",
  "/docs/goal-progress.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/scholartrace/api/app.py" = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
